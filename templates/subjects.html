{% extends "base.html" %}{% block content %}<h1>Subject Management</h1><section class="panel"><h2>Add Subject</h2><form method="post" class="form-grid"><div><label>Subject Code *</label><input name="subject_code" required placeholder="e.g. PCCMC105P"></div><div><label>Subject Name *</label><input name="subject_name" required placeholder="Subject name"></div><div style="align-self:end"><button>Add Subject</button></div></form></section><section class="panel"><h2>Available Subjects</h2><div class="table-wrap"><table><thead><tr><th>Code</th><th>Subject</th><th>Action</th></tr></thead><tbody>{% for s in subjects %}<tr><td>{{ s.subject_code }}</td><td>{{ s.subject_name }}</td><td><form method="post" action="{{ url_for('delete_subject',subject_id=s.id) }}" onsubmit="return confirm('Delete this subject and linked attendance?')"><button class="danger">Delete</button></form></td></tr>{% else %}<tr><td colspan="3" class="empty">No subjects added.</td></tr>{% endfor %}</tbody></table></div></section>{% endblock %}
